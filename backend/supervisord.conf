[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true
silent=false
minfds=1024
minprocs=200
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:web]
# 多 worker 并行处理：Django ASGI 下同步视图经 sync_to_async 默认 thread_sensitive=True，
# 单进程内所有同步视图串行执行，并发请求会排队（实测 10 并发需 4-7s）。
# 用 --workers 多进程并行解决，worker 数取 CPU 核数的一半（4）。
command=python -m uvicorn black_bag.asgi:application --host 0.0.0.0 --port 8000 --workers 4

[program:django_q_worker]
command=python manage.py qcluster

[program:locust_report_watchdog]
# 压测报告守护进程：每 30s 扫描一次「压测中」但实际已中断的僵尸报告，自动收口为「失败」
# 并写明中断原因。压测若被 OOM/kill 或写回失败，没有它会永远停在「压测中」，
# 前端会一直轮询、用户看到一条"没有结果"的报告。
# 必须作为独立进程常驻：它要持续运行，不能挂在 web 请求里；且不 import locust，
# 不会触发 gevent monkey-patch。
command=python manage.py locust_report_watchdog --interval 30 --grace 300 --hard-limit 1800
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/app/logs/watchdog_stdout.log
stderr_logfile=/app/logs/watchdog_stderr.log
stdout_logfile_maxbytes=20MB
stderr_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile_backups=3
