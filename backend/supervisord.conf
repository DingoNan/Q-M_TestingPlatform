[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/tmp/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/tmp/supervisord.pid
nodaemon=true
silent=false
minfds=1024
minprocs=200
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:web]
# 多 worker 并行处理：Django ASGI 下同步视图经 sync_to_async 默认 thread_sensitive=True，
# 单进程内所有同步视图串行执行，并发请求会排队（实测 10 并发需 4-7s）。
# 用 --workers 多进程并行解决，worker 数取 CPU 核数的一半（4）。
command=python -m uvicorn black_bag.asgi:application --host 0.0.0.0 --port 8000 --workers 4

[program:django_q_worker]
command=python manage.py qcluster
