name: blackbagtest

services:
  mysql:
    image: mysql:8.0
    container_name: blackbag-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-blackbag_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blackbag}
      MYSQL_USER: ${MYSQL_USER:-blackbag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blackbag}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
      - --sort-buffer-size=8388608
      - --join-buffer-size=8388608
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-blackbag_root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - blackbag-net

  redis:
    image: redis:7-alpine
    container_name: blackbag-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then redis-server --requirepass "$$REDIS_PASSWORD"; else redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - blackbag-net

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: blackbag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - blackbag-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blackbag-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      RUN_ENV: docker
      QDRANT_HOST: qdrant
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-blackbag}
      MYSQL_USER: ${MYSQL_USER:-blackbag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-blackbag}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      TZ: Asia/Shanghai
    volumes:
      - ./backend/logs:/app/logs
      - backend_chroma:/app/chroma_db
      - backend_uploads:/app/upload_files
    ports:
      - "8000:8000"
    networks:
      - blackbag-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blackbag-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - blackbag-net

volumes:
  mysql_data:
  redis_data:
  qdrant_storage:
  backend_chroma:
  backend_uploads:

networks:
  blackbag-net:
    driver: bridge
