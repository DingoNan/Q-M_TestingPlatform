<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    
    <!-- 自动化测试平台SVG图标 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='grad' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23f59e0b'/><stop offset='100%' stop-color='%23f97316'/></linearGradient></defs><circle cx='32' cy='32' r='30' fill='url(%23grad)' stroke='%23ffffff' stroke-width='2'/><path d='M22 18v12h8v8h8v-8h2c1.1 0 2-.9 2-2s-.9-2-2-2h-2V18h-8v-6h-4v6h-8zm0 24v-6h-2c-2.2 0-4-1.8-4-4v-6H14v12h8v6h4v-6h8v-8h-8v-6h-4v6zm26 8v-4h-4v4h4zm-4-6v-6h4v6h-4z' fill='%23ffffff'/></svg>">
    
    <!-- 针对不同浏览器图标的备用方案 -->
    <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23f59e0b'/><stop offset='100%' stop-color='%23f97316'/></linearGradient></defs><circle cx='32' cy='32' r='30' fill='url(%23g)'/><path d='M22 18v12h8v8h8v-8h2c1.1 0 2-.9 2-2s-.9-2-2-2h-2V18h-8v-6h-4v6h-8zm0 24v-6h-2c-2.2 0-4-1.8-4-4v-6H14v12h8v6h4v-6h8v-8h-8v-6h-4v6zm26 8v-4h-4v4h4zm-4-6v-6h4v6h-4z' fill='%23ffffff'/></svg>">
    
    <!-- 页面标题 -->
    <title>Q·M 测试平台</title>
    
    <!-- 简单优化样式，不影响原有布局 -->
    <style>
      /* 基础优化 - 不会影响应用加载后的样式 */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f7fa;
        margin: 0;
        overflow-x: hidden;
      }
      
      /* 预加载动画 - 只在应用加载前显示 */
      #app:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      }
      
      /* 加载动画样式 */
      #app:empty::before {
        content: '';
        width: 0;
        height: 0;
        margin-bottom: 0;
      }
      
      #app:empty::after {
        content: '';
        font-size: 0;
        margin-top: 0;
      }
      
      /* 简单的加载动画 */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      
      /* 跳动动画 */
      @keyframes bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        25% { transform: translateY(-20px) scale(1.1); }
        50% { transform: translateY(0) scale(1); }
        75% { transform: translateY(-10px) scale(1.05); }
      }
      
      /* 漂浮动画 */
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        25% { transform: translateY(-3px) rotate(2deg); }
        75% { transform: translateY(2px) rotate(-2deg); }
      }
      
      /* 六边形脉动动画 */
      @keyframes hexagonPulse {
        0%, 100% { stroke-width: 4; }
        50% { stroke-width: 5; }
      }
      
      /* 中心脉动动画 */
      @keyframes centerPulse {
        0%, 100% { opacity: 0.8; r: 20; }
        50% { opacity: 1; r: 21; }
      }
      
      /* 光晕脉动动画 */
      @keyframes glowPulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.5; transform: scale(1.05); }
      }
      
      /* 文字渐隐动画 */
      @keyframes fadeInOut {
        0%, 100% { opacity: 0.7; }
        50% { opacity: 1; }
      }
      
      /* 打印样式优化 */
      @media print {
        body {
          background-color: white;
        }
      }
    </style>
    
    <!-- 添加一些有用的meta标签 -->
    <meta name="description" content="专业的自动化测试平台，支持接口测试、Web/App UI自动化、性能测试等功能">
    <meta name="keywords" content="自动化测试,测试平台,接口测试,UI自动化,性能测试">
    <meta name="author" content="Q·M">
    
    <!-- 主题颜色（浏览器地址栏颜色） -->
    <meta name="theme-color" content="#f59e0b">
    
  </head>
  <body>
    <noscript>
      <div style="text-align: center; padding: 50px 20px; max-width: 600px; margin: 0 auto;">
        <h2 style="color: #dc2626;">JavaScript 已禁用</h2>
        <p style="color: #4b5563; line-height: 1.6; margin: 20px 0;">
          自动化测试平台需要JavaScript才能正常运行。请启用浏览器中的JavaScript功能，然后刷新页面继续。
        </p>
        <div style="margin-top: 30px; padding: 15px; background-color: #fef2f2; border-radius: 8px; border-left: 4px solid #dc2626;">
          <p style="margin: 0; color: #7f1d1d;">
            <strong>启用JavaScript的方法：</strong><br>
            1. 点击浏览器地址栏右侧的锁形图标或信息图标<br>
            2. 在弹出菜单中找到"网站设置"或类似选项<br>
            3. 将JavaScript设置为"允许"<br>
            4. 刷新页面
          </p>
        </div>
      </div>
    </noscript>
    
    <!-- 原有的应用容器 -->
    <div id="app"></div>
    
    <!-- 当应用挂载后移除加载动画 -->
    <script>
      // 监听DOM变化，当Vue应用挂载后移除加载样式
      const observer = new MutationObserver(function(mutations) {
        mutations.forEach(function(mutation) {
          if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
            // 当#app中有内容添加时，说明Vue应用已挂载
            const appElement = document.getElementById('app');
            if (appElement && appElement.children.length > 0) {
              // 可以在这里执行一些应用挂载后的操作
              console.log('自动化测试平台已加载完成');
              observer.disconnect(); // 停止观察
            }
          }
        });
      });
      
      // 开始观察#app元素的变化
      const appElement = document.getElementById('app');
      if (appElement) {
        observer.observe(appElement, { childList: true });
      }
      
      // 添加动态加载动画
      document.addEventListener('DOMContentLoaded', function() {
        const appElement = document.getElementById('app');
        if (appElement && appElement.children.length === 0) {
          // 创建加载动画容器
          const loadingContainer = document.createElement('div');
          loadingContainer.id = 'loading-animation';
          loadingContainer.style.cssText = `
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 9999;
          `;
          
          // 创建Logo容器
          const logoContainer = document.createElement('div');
          logoContainer.style.cssText = `
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 30px;
          `;
          
          // 创建SVG Logo
          const svgNS = "http://www.w3.org/2000/svg";
          const svg = document.createElementNS(svgNS, "svg");
          svg.setAttribute("viewBox", "0 0 100 100");
          svg.setAttribute("width", "100%");
          svg.setAttribute("height", "100%");
          svg.style.cssText = `
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.7));
            animation: bounce 1.5s ease-in-out infinite;
          `;
          
          // 创建六边形
          const hexagon = document.createElementNS(svgNS, "path");
          hexagon.setAttribute("d", "M50,10 L90,30 L90,70 L50,90 L10,70 L10,30 Z");
          hexagon.setAttribute("fill", "none");
          hexagon.setAttribute("stroke", "#6366f1");
          hexagon.setAttribute("stroke-width", "4");
          hexagon.setAttribute("stroke-linecap", "round");
          hexagon.setAttribute("stroke-linejoin", "round");
          hexagon.style.animation = "hexagonPulse 2s ease-in-out infinite";
          
          // 创建中心圆
          const center = document.createElementNS(svgNS, "circle");
          center.setAttribute("cx", "50");
          center.setAttribute("cy", "50");
          center.setAttribute("r", "20");
          center.setAttribute("fill", "#6366f1");
          center.setAttribute("opacity", "0.8");
          center.style.animation = "centerPulse 1.5s ease-in-out infinite";
          
          // 创建方形
          const square = document.createElementNS(svgNS, "path");
          square.setAttribute("d", "M35,35 L65,35 L65,65 L35,65 Z");
          square.setAttribute("fill", "rgba(255, 255, 255, 0.9)");
          
          // 添加元素到SVG
          svg.appendChild(hexagon);
          svg.appendChild(center);
          svg.appendChild(square);
          
          // 创建光晕效果
          const glow = document.createElement('div');
          glow.style.cssText = `
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%);
            animation: glowPulse 2.5s ease-in-out infinite;
            z-index: -1;
          `;
          
          // 添加到容器
          logoContainer.appendChild(svg);
          logoContainer.appendChild(glow);
          
          // 创建加载文字
          const loadingText = document.createElement('div');
          loadingText.style.cssText = `
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            font-weight: 500;
            letter-spacing: 2px;
            animation: fadeInOut 2s ease-in-out infinite;
            margin-top: 20px;
            text-align: center;
          `;
          loadingText.innerHTML = '加载中<span class="loading-dots"></span>';
          
          // 创建动态点
          const loadingDots = document.createElement('span');
          loadingDots.className = 'loading-dots';
          loadingDots.style.cssText = `
            display: inline-block;
            width: 30px;
            text-align: left;
          `;
          
          // 动态点动画
          const dots = ['.', '..', '...'];
          let dotIndex = 0;
          setInterval(() => {
            loadingDots.textContent = dots[dotIndex];
            dotIndex = (dotIndex + 1) % dots.length;
          }, 500);
          
          loadingText.appendChild(loadingDots);
          
          // 添加到加载容器
          loadingContainer.appendChild(logoContainer);
          loadingContainer.appendChild(loadingText);
          
          // 添加到body
          document.body.appendChild(loadingContainer);
          
          // 添加样式表
          const style = document.createElement('style');
          style.textContent = `
            @keyframes bounce {
              0%, 100% { transform: translateY(0) scale(1); }
              25% { transform: translateY(-20px) scale(1.1); }
              50% { transform: translateY(0) scale(1); }
              75% { transform: translateY(-10px) scale(1.05); }
            }
            
            @keyframes hexagonPulse {
              0%, 100% { stroke-width: 4; }
              50% { stroke-width: 5; }
            }
            
            @keyframes centerPulse {
              0%, 100% { opacity: 0.8; r: 20; }
              50% { opacity: 1; r: 21; }
            }
            
            @keyframes glowPulse {
              0%, 100% { opacity: 0.3; transform: scale(1); }
              50% { opacity: 0.5; transform: scale(1.05); }
            }
            
            @keyframes fadeInOut {
              0%, 100% { opacity: 0.7; }
              50% { opacity: 1; }
            }
            
            #app:empty {
              display: none;
            }
          `;
          document.head.appendChild(style);
          
          // 当Vue应用加载完成后移除加载动画
          window.addEventListener('load', function() {
            setTimeout(function() {
              const loadingElement = document.getElementById('loading-animation');
              if (loadingElement) {
                loadingElement.style.opacity = '0';
                loadingElement.style.transition = 'opacity 0.5s ease';
                setTimeout(function() {
                  loadingElement.remove();
                }, 500);
              }
            }, 1000); // 确保至少显示1秒
          });
          
          // 防止应用加载失败时一直显示加载动画
          setTimeout(function() {
            const loadingElement = document.getElementById('loading-animation');
            if (loadingElement && document.getElementById('app').children.length === 0) {
              loadingElement.style.opacity = '0';
              loadingElement.style.transition = 'opacity 0.5s ease';
              setTimeout(function() {
                loadingElement.remove();
              }, 500);
            }
          }, 10000); // 10秒后自动移除
        }
      });
      
      // 页面加载时添加一些优化
      window.addEventListener('load', function() {
        // 防止页面滚动时出现卡顿
        document.body.style.overflow = 'auto';
        
        // 简单的性能记录
        if (window.performance) {
          const perfData = window.performance.timing;
          const pageLoadTime = perfData.loadEventEnd - perfData.navigationStart;
          console.log(`页面加载时间: ${pageLoadTime}ms`);
        }
      });
      
      // 防止移动端缩放
      document.addEventListener('touchstart', function(event) {
        if (event.touches.length > 1) {
          event.preventDefault();
        }
      }, { passive: false });
      
      // 禁用双击缩放
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) {
          event.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    </script>
  </body>
</html>
