server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1k;

    # SPA 静态资源长缓存（带 hash 的构建产物）
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，确保发版后浏览器立即加载新版本（hash 资源已带 immutable 长缓存）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # 前端使用 hash 路由（createWebHashHistory），所有路由都在 # 之后，
    # 浏览器只会请求 / 与静态资源；API 请求由 axios 通过绝对 base_url
    # （http://<host>:8000）直接访问后端容器，无需此处反向代理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
